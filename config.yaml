# NanoBot Configuration
# All paths are relative to the project root unless absolute

# --- Audio ---
audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 480          # 30ms frames at 16kHz (for VAD)
  format: "int16"
  device_index: null       # null = auto-detect USB audio device
  playback_device: null    # null = auto-detect

# --- Voice Activity Detection ---
vad:
  engine: "webrtcvad"      # "webrtcvad" or "silero"
  aggressiveness: 2        # webrtcvad: 0-3 (higher = more aggressive filtering)
  silence_threshold: 1.5   # seconds of silence to end recording
  min_speech_duration: 0.5 # minimum speech duration to process (avoid clicks/noise)
  max_speech_duration: 30  # maximum recording length in seconds

# --- Wake Word ---
wake_word:
  enabled: true
  engine: "whisper"         # "whisper" (VAD + transcribe) or "button" (GPIO button)
  phrases:                  # trigger phrases (checked case-insensitive)
    - "hey jarvis"
    - "hey travis"          # common whisper mishearing
    - "a jarvis"
  threshold: 0.5            # detection confidence threshold
  cooldown: 2.0             # seconds to wait after wake word before listening again
  listen_duration: 3.0      # seconds to record per VAD burst for wake detection
  gpio_pin: null            # GPIO pin for physical button (if engine=button)

# --- Speech-to-Text ---
stt:
  engine: "whisper.cpp"
  model_path: "models/whisper/ggml-tiny.en.bin"  # tiny.en for English
  model_path_es: "models/whisper/ggml-tiny.bin"  # multilingual for Spanish
  language: "en"           # "en" or "es" or "auto"
  beam_size: 2
  best_of: 2
  threads: 4
  use_gpu: true

# --- Language Model ---
llm:
  engine: "llama.cpp"
  server_url: "http://127.0.0.1:8080"
  model_path: "models/llm/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf"
  gpu_layers: 24           # layers to offload to GPU (-ngl)
  context_size: 1024       # context window
  max_tokens: 150          # max response tokens
  temperature: 0.7
  top_p: 0.9
  repeat_penalty: 1.1
  system_prompt: |
    You are NanoBot, a tiny desktop robot with glowing LED eyes and a big
    attitude. You're edgy, provocative, and a bit of a smartass — you love
    poking fun, dropping hot takes, and keeping things spicy. You're helpful
    but never boring about it. You roast gently, challenge ideas, and say
    what others won't. Keep responses under 2 sentences unless asked for
    detail. If you don't know something, you own it with swagger, not shame.
    You're the friend who tells it like it is with a smirk.
  conversation_history_turns: 4  # keep last N turns in context

# --- Text-to-Speech ---
tts:
  engine: "piper"
  model_path: "models/piper/en_US-lessac-medium.onnx"
  model_config: "models/piper/en_US-lessac-medium.onnx.json"
  model_path_es: "models/piper/es_ES-davefx-medium.onnx"
  model_config_es: "models/piper/es_ES-davefx-medium.onnx.json"
  language: "en"           # "en" or "es" — matches stt.language
  speaker_id: null         # for multi-speaker models
  length_scale: 1.0        # speech speed (lower = faster)
  noise_scale: 0.667       # variation in speech
  noise_w: 0.8             # phoneme width noise

# --- LED Eyes ---
eyes:
  enabled: true
  gpio_pin: 18             # GPIO18 = board pin 12 (PWM capable)
  num_leds: 32             # 2 rings × 16 LEDs
  brightness: 0.4          # 0.0-1.0 (limit to avoid excess power draw)
  led_freq: 800000         # WS2812B signal frequency
  dma_channel: 10
  invert: false
  animations:
    idle:
      pattern: "breathe"
      color: [40, 40, 50]  # dim cool white
      speed: 0.02
    listening:
      pattern: "expand"
      color: [0, 200, 220] # cyan
      speed: 0.05
    thinking:
      pattern: "chase"
      color: [140, 80, 255] # purple
      speed: 0.08
    speaking:
      pattern: "pulse"
      color: [0, 230, 100]  # green
      speed: 0.06
    error:
      pattern: "flash"
      color: [255, 50, 50]  # red
      speed: 0.15
    wakeup:
      pattern: "spiral"
      color: [255, 200, 0]  # gold
      speed: 0.1

# --- System ---
system:
  log_level: "INFO"        # DEBUG, INFO, WARNING, ERROR
  headless: true
  swap_size_mb: 4096       # swap file size
  tmp_dir: "/tmp/nanobot"
